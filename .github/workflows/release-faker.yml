name: Release OCF authoring CLI
on:
  push:
    tags: ["faker-v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/faker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/faker/package-lock.json
      - name: Match release tag to package version
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "faker-v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm test
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - run: bash scripts/smoke-pack.sh "$RUNNER_TEMP"/open-captable-faker-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: faker-npm
          path: ${{ runner.temp }}/open-captable-faker-*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: faker-npm
      - name: Publish tested package
        run: |
          tag=latest
          if [[ ${GITHUB_REF_NAME#faker-v} == *-* ]]; then tag=next; fi
          npm publish ./open-captable-faker-*.tgz --access public --provenance --tag "$tag"
