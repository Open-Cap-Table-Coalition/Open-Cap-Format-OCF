name: Release OCF Python Types

# Builds the `ocf-types` Python package from the schemas at the tag, attaches the
# wheel and the source archive to the tag's GitHub Release, and publishes them to
# PyPI with trusted publishing (OIDC). No PyPI token is stored anywhere.
#
# Publishing is off until a maintainer has registered this workflow as a trusted
# publisher on PyPI and set the repository variable PUBLISH_PYTHON_TYPES to
# "true". See docs/development/python-types-release.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing OCF tag to release from main (leave blank for a dry run)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build the ocf-types Python package
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write # create/update the tag's Release and upload the files
    steps:
      - name: Checkout
        uses: actions/checkout@v2.4.0

      - name: Select release tag and schemas
        id: release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/select-release-schemas.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Generate types into the package
        run: npm run build:ocf-types-python -- --fail-on-warnings

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # v1.2.0 becomes 1.2.0. A pre-release tag such as v1.3.0-b1 becomes
      # 1.3.0b1 when the package is built.
      - name: Pin package version to the tag
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        working-directory: packages/ocf-types-python
        run: sed -i "s/^version = .*/version = \"${RELEASE_TAG#v}\"/" pyproject.toml

      - name: Build
        working-directory: packages/ocf-types-python
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      # Always produce an inspectable artifact (manual runs included).
      - name: Upload the built package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocf-types-python
          path: packages/ocf-types-python/dist/*
          if-no-files-found: error

      - name: Attach the built package to the GitHub Release
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        working-directory: packages/ocf-types-python
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber \
            || gh release create "$RELEASE_TAG" --verify-tag dist/* \
                 --title "$RELEASE_TAG" \
                 --notes "OCF types for $RELEASE_TAG."

  publish:
    name: Publish to PyPI
    if: needs.build.outputs.release_tag != '' && vars.PUBLISH_PYTHON_TYPES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ocf-types/
    permissions:
      id-token: write # the OIDC token PyPI exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ocf-types-python
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
