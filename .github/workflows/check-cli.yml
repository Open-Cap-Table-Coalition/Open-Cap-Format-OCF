name: Check OCF authoring CLI
on:
  pull_request:
    paths:
      - "packages/cli/**"
      - "schema/**"
      - "utils/schema-utils/**"
      - ".github/workflows/check-cli.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - run: bash scripts/smoke-pack.sh "$RUNNER_TEMP"/open-captable-cli-*.tgz
