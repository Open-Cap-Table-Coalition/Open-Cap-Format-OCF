[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocf-types"
# Set from the release tag by .github/workflows/release-ocf-types-python.yml.
version = "0.0.0"
description = "Python types for the Open Cap Format (OCF), generated from the OCF JSON Schemas."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
keywords = ["ocf", "open-cap-format", "cap-table", "types", "typing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
# NotRequired, ReadOnly and a TypedDict that understands them, on every supported Python.
dependencies = ["typing_extensions>=4.9"]

[project.urls]
Homepage = "https://github.com/Open-Cap-Table-Coalition/Open-Cap-Format-OCF#readme"
Repository = "https://github.com/Open-Cap-Table-Coalition/Open-Cap-Format-OCF"
Issues = "https://github.com/Open-Cap-Table-Coalition/Open-Cap-Format-OCF/issues"

[tool.hatch.build.targets.wheel]
packages = ["ocf_types"]

[tool.hatch.build.targets.sdist]
include = ["ocf_types", "README.md", "LICENSE.md"]

# ocf_types/__init__.py is generated at build time and is not committed, so the
# build must not skip it for being ignored by git.
[tool.hatch.build]
ignore-vcs = true

# The checks CI runs over tests/, against the installed package.
[tool.pyright]
include = ["tests"]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.mypy]
strict = true
warn_unused_ignores = true
